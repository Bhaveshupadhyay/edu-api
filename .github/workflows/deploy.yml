name: Deploy to Railway

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Web Service (edu-api)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "edu-api" --detach

      - name: Deploy Worker Service (distinguished-tranquility)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "distinguished-tranquility" --detach